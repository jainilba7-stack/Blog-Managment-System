<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - BlogSphere</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
</head>

<body class="auth-body">

    <div class="auth-wrapper">
        <div class="auth-visual">
            <div class="auth-visual-content fade-in-up">
                <a href="index.html" class="logo light">Blog<span>Sphere</span></a>
                <h2>Your story starts here.</h2>
                <p>Join thousands of writers sharing ideas, experiences, and expertise with the world.</p>
                <div class="floating-cards">
                    <div class="fcard fcard1">✨ Free forever</div>
                    <div class="fcard fcard2">🚀 Publish in seconds</div>
                    <div class="fcard fcard3">🌍 Global audience</div>
                </div>
            </div>
            <div class="auth-shape shape-a"></div>
            <div class="auth-shape shape-b"></div>
        </div>

        <div class="auth-form-side">
            <div class="auth-card fade-in-up">
                <h1>Create Account</h1>
                <p class="auth-sub">Join BlogSphere and start publishing today</p>

                <form id="registerForm">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="name" placeholder="Jainil Aliwala" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <div class="password-wrap">
                            <input type="password" id="password" placeholder="Min. 6 characters" required minlength="6">
                            <span class="toggle-pass" id="togglePass">👁️</span>
                        </div>
                        <div class="strength-bar"><span id="strengthFill"></span></div>
                    </div>
                    <div class="form-error" id="formError"></div>
                    <button type="submit" class="btn btn-primary btn-block" id="registerBtn">
                        <span class="btn-text">Create Account</span>
                        <span class="btn-spinner"></span>
                    </button>
                </form>

                <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/register.js"></script>
</body>

</html>
