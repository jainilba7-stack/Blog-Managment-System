<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BlogSphere</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
</head>

<body class="auth-body">

    <div class="auth-wrapper">
        <div class="auth-visual">
            <div class="auth-visual-content fade-in-up">
                <a href="index.html" class="logo light">Blog<span>Sphere</span></a>
                <h2>Welcome back, storyteller.</h2>
                <p>Log in to continue writing, publishing, and connecting with readers around the world.</p>
                <div class="floating-cards">
                    <div class="fcard fcard1">📝 New draft saved</div>
                    <div class="fcard fcard2">❤️ 128 likes on your post</div>
                    <div class="fcard fcard3">👀 2.3k views today</div>
                </div>
            </div>
            <div class="auth-shape shape-a"></div>
            <div class="auth-shape shape-b"></div>
        </div>

        <div class="auth-form-side">
            <div class="auth-card fade-in-up">
                <h1>Log In</h1>
                <p class="auth-sub">Enter your credentials to access your dashboard</p>

                <form id="loginForm">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <div class="password-wrap">
                            <input type="password" id="password" placeholder="••••••••" required>
                            <span class="toggle-pass" id="togglePass">👁️</span>
                        </div>
                    </div>
                    <div class="form-error" id="formError"></div>
                    <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                        <span class="btn-text">Log In</span>
                        <span class="btn-spinner"></span>
                    </button>
                </form>

                <p class="auth-switch">Don't have an account? <a href="register.html">Sign up</a></p>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
